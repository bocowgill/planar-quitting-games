automation:
  methods:
    - method: "agent"
      models: ["GPT-6.2-Sol"]
      framework: "OpenAI Codex"
      tool_setup: "OpenAI Codex helped with the Lean formalization."
fidelity:
  divergences: >-
    Live histories are indexed by their length. At an absorbing state every
    stage gives the fixed prize. The affine-plane condition is specified by
    an affine representation in two real coordinates.
