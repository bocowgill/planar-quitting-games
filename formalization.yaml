# Review draft. Add the maintainer's selected SPDX licence before public release.
version: "v0.4"
project:
  name: "Uniform equilibrium in planar quitting games"
  description: >-
    Every finite quitting game whose singleton prizes lie in an affine plane
    has a uniform Nash equilibrium payoff under independent randomization.
    One profile per tolerance works at every sufficiently large horizon
    against arbitrary unilateral behavioral deviations.
  authors: ["Bo Cowgill"]
  responsible_maintainers: ["Bo Cowgill"]
  role: "substantive-development"
classification:
  arxiv: ["math.OC"]
  msc2020: ["91A15"]
sources:
  - title: "Uniform equilibrium in planar quitting games"
    type: "original-proof"
    relationship: "other"
    note: "Working paper forthcoming."
  - title: "Absorption paths and equilibria in quitting games"
    authors: ["Galit Ashkenazi-Golan", "Ilia Krasikov", "Catherine Rainer", "Eilon Solan"]
    id: "https://doi.org/10.1007/s10107-022-01807-6"
    type: "paper"
    relationship: "background"
status:
  scope: >-
    The Comparator configuration selects the full affine-plane existence
    theorem. The proof covers the regular-core stationary comparison or
    directed cycle, all equilibrium implementations, and the perturbation
    argument for degenerate configurations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PlanarQuitting.planar_uniform_payoff"
      file: "PlanarQuitting/Existence.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PlanarQuitting.periodic_calendar_uniform_payoff"
      file: "PlanarQuitting/Independent.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "PlanarQuitting.uniform_of_feasible_no_sink"
      file: "PlanarQuitting/CycleImplementation.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "PlanarQuitting.uniform_of_stationary_exit"
      file: "PlanarQuitting/Stationary.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "PlanarQuitting.signed_count_transfer"
